<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Moodnote</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="Style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- Internal CSS-->
     <style>
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(#fff, #fff1db);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    .stat-card .emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 8px;
    }

    .stat-chart {
        width: 90%;
        max-width: 700px;
        margin: 0 auto 40px auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 6px 25px rgba(0, 0, 0, 0.15);
    }

    .stat-chart canvas {
        width: 100% !important;
        height: 400px !important;
    }
     </style>

</head>
<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
    const moodData = {
        labels: ['Happy', 'Sad', 'Angry', 'Neutral'],
        datasets: [{
            label: 'Number of Posts',
            data: [20, 5, 3, 7],
            backgroundColor: [
                '#FFD700', // Happy - Yellow
                '#1E90FF', // Sad - Blue
                '#FF4500', // Angry - Red
                '#32CD32'  // Neutral - Green
            ],
            borderRadius: 8
        }]
    };

    const config = {
        type: 'bar',
        data: moodData,
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                title: {
                    display: true,
                    text: 'Mood Statistics',
                    font: { size: 18 }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    };

    // Render chart
    new Chart(document.getElementById('moodChart'), config);
</script>
<body>
    <div class="container">
        <center><h1>Statistics</h1></center>
        <div class="stats-cards">
      <div class="stat-card">
        <span class="emoji">😀</span>
        <h2>20</h2>
        <p>Happy</p>
      </div>

      <div class="stat-card">
        <span class="emoji">😢</span>
        <h2>5</h2>
        <p>Sad</p>
      </div>
      
      <div class="stat-card">
        <span class="emoji">😠</span>
        <h2>3</h2>
        <p>Angry</p>
      </div>

      <div class="stat-card">
        <span class="emoji">😐</span>
        <h2>7</h2>
        <p>Neutral</p>
      </div>
        </div>

      <div class="stat-chart">
    <canvas id="moodChart"></canvas>
    </div>
</body>
</html>
